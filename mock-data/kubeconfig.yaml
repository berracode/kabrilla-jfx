# Kubeconfig FALSO para el perfil mock. Mismo formato que genera "aws eks update-kubeconfig".
# El nombre corto del cluster (lo que va después de "cluster/") debe coincidir con clusters.json,
# credentials.json y la carpeta logs/<cluster>/.
apiVersion: v1
kind: Config
clusters:
- name: arn:aws:eks:us-east-1:000000000000:cluster/mock-qa
  cluster:
    server: https://MOCK-QA.gr7.us-east-1.eks.amazonaws.com
    certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1PQ0stQ0EtTk8tRVMtVU4tQ0VSVElGSUNBRE8tUkVBTAotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0tCg==
- name: arn:aws:eks:us-east-1:000000000000:cluster/mock-dev
  cluster:
    server: https://MOCK-DEV.gr7.us-east-1.eks.amazonaws.com
    certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1PQ0stQ0EtTk8tRVMtVU4tQ0VSVElGSUNBRE8tUkVBTAotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0tCg==
contexts:
- name: mock-qa
  context:
    cluster: arn:aws:eks:us-east-1:000000000000:cluster/mock-qa
    user: mock-user
- name: mock-dev
  context:
    cluster: arn:aws:eks:us-east-1:000000000000:cluster/mock-dev
    user: mock-user
users:
- name: mock-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: aws
      args:
      - eks
      - get-token
      - --cluster-name
      - mock-qa
current-context: mock-qa
