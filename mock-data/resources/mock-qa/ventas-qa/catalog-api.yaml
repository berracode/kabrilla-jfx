# Manifiestos FALSOS del deployment catalog-api: sin HPA ni ConfigMaps (prueba los estados vacíos).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: ventas-qa
spec:
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/catalog-api:2.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: ventas-qa
spec:
  type: LoadBalancer
  clusterIP: 172.20.90.12
  selector:
    app: catalog-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 31080
status:
  loadBalancer:
    ingress:
      - hostname: a1b2c3-mock.elb.us-east-1.amazonaws.com
---
# Canary 90/10 por subsets, expuesto dentro del mesh y por un Gateway interno del mismo namespace
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: catalog-api
  namespace: ventas-qa
spec:
  hosts:
    - catalog-api
    - catalog.internal.mock.example.com
  gateways:
    - mesh
    - ventas-internal
  http:
    - route:
        - destination:
            host: catalog-api
            subset: v2
            port:
              number: 80
          weight: 90
        - destination:
            host: catalog-api
            subset: v1
            port:
              number: 80
          weight: 10
