# Manifiestos FALSOS del deployment catalog-api: sin HPA ni ConfigMaps (prueba los estados vacíos).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: ventas-qa
spec:
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/catalog-api:2.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: ventas-qa
spec:
  type: LoadBalancer
  clusterIP: 172.20.90.12
  selector:
    app: catalog-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 31080
status:
  loadBalancer:
    ingress:
      - hostname: a1b2c3-mock.elb.us-east-1.amazonaws.com
