name: Build and Release Desktop Portable

# Se dispara al subir un tag semver: v1.2.3, v1.2.3-beta.1, v1.2.3-rc.2 ...
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Portable Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate tag and resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Semantic Versioning: vMAJOR.MINOR.PATCH con pre-release opcional (-beta.1, -rc.2)
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$') {
              Write-Error "[ERROR] El tag '$tag' no es semver (ej: v1.2.3 o v1.2.3-beta.1)"
              exit 1
          }
          $version = $tag.Substring(1)
          $prerelease = if ($tag.Contains('-')) { 'true' } else { 'false' }
          Write-Host "[INFO] Versión: $version (pre-release: $prerelease)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Tests incluidos (sin los de UI, que necesitan sesión gráfica). jpackage genera target/dist/Kabrilla
      - name: Build, Test and Package with Maven
        shell: pwsh
        run: .\mvnw.cmd -B clean package -Pportable "-Drevision=${{ steps.version.outputs.version }}" "-DexcludedGroups=ui"

      - name: Compress App Image to Zip
        id: zip
        shell: pwsh
        run: |
          $appImagePath = "target/dist/Kabrilla"
          $zipName = "kabrilla-${{ steps.version.outputs.version }}-win-portable.zip"
          if (-not (Test-Path "$appImagePath/Kabrilla.exe")) {
              Write-Error "[ERROR] No se encontró la app generada por jpackage en: $appImagePath"
              exit 1
          }
          Write-Host "[INFO] Comprimiendo $appImagePath hacia target/$zipName..."
          Compress-Archive -Path $appImagePath -DestinationPath "target/$zipName" -Force
          Write-Host "[SUCCESS] ZIP creado: target/$zipName"
          "zip=target/$zipName" >> $env:GITHUB_OUTPUT

      # Notas escritas a mano (docs/releases/<tag>.md) si existen; GitHub agrega debajo los cambios generados
      - name: Find release notes
        id: notes
        shell: pwsh
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (Test-Path $notes) {
              Write-Host "[INFO] Usando notas de $notes"
              "path=$notes" >> $env:GITHUB_OUTPUT
          } else {
              Write-Host "[INFO] Sin notas manuales: solo notas generadas"
          }

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.zip }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
