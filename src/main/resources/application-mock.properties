# Perfil mock: se activa con  ./mvnw javafx:run -Pmock  (o --spring.profiles.active=mock)
# Carpeta con los datos simulados (relativa al directorio de trabajo, normalmente la raíz del proyecto)
kabrilla.mock.dir=mock-data
# Retardo entre líneas al reproducir un archivo de logs. No bajar de ~20 ms: el consumidor de la UI
# procesa como máximo ~100 líneas/s y la cola (5000) lanza excepción si se llena.
kabrilla.mock.line-delay-ms=100
# Consultas por rango: separación entre líneas del archivo de un pod. La última línea tiene la hora de arranque
# de la app; con 2000 ms un archivo de ~450 líneas cubre ~15 minutos hacia atrás.
kabrilla.mock.history-step-ms=2000
