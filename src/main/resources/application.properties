# Tema oscuro de Kabrilla (css/kabrilla-dark.css). false = tema base de JavaFX (solo css/kabrilla-base.css).
# Cambiar sin tocar este archivo:  ./mvnw javafx:run -Pno-styles   (o --kabrilla.ui.styles-enabled=false)
kabrilla.ui.styles-enabled=true

# Carpeta de datos local (namespaces registrados y credenciales). Fuera de la carpeta de la app para sobrevivir
# a actualizaciones. En el primer arranque se copian los archivos de versiones anteriores del directorio de trabajo.
kabrilla.data-dir=${user.home}/.kabrilla

# Versión de la app (kabrilla.version), escrita por Maven en el build
spring.config.import=optional:classpath:kabrilla-version.properties
